[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grand-council"
version = "0.2.0"
description = "Local multi-model deliberation workspace with Hugging Face model management"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "huggingface-hub>=0.27,<2",
  "psutil>=5.9,<8",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
transformers = ["torch>=2.2", "transformers>=4.48,<6", "accelerate>=1.5", "safetensors>=0.4", "sentencepiece>=0.2", "protobuf>=5"]
gguf = ["llama-cpp-python>=0.3"]
dev = ["pytest>=8", "httpx>=0.27"]
desktop = ["PySide6>=6.7,<7", "PyInstaller>=6.11"]

[project.scripts]
grand-council = "grand_council.server:main"
grand-council-desktop = "grand_council.desktop:main"

[tool.setuptools.packages.find]
include = ["grand_council*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
grand_council = ["static/*"]
